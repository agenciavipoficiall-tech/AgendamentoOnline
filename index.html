<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>STUDIO T CONCEPT — Conceito, Sofisticação e Beleza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#08080a;--black-2:#0d0d10;--satin:#121216;--surface:#15151a;--surface-2:#1b1b21;
  --line:rgba(201,169,97,.14);--line-soft:rgba(255,255,255,.06);
  --gold:#c9a961;--gold-2:#e3cf9a;--gold-3:#8f7434;
  --white:#f4f2ed;--muted:#8e8e97;--muted-2:#63636c;
  --danger:#c96a5c;--ok:#7fae8a;
  --ff-display:'Cormorant Garamond',Georgia,serif;
  --ff-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.19,1,.22,1);--ease-2:cubic-bezier(.4,0,.2,1);
  --nav-h:76px;--pad:clamp(20px,5vw,80px);
}
html[data-theme="light"]{
  --black:#f7f5f1;--black-2:#efece6;--satin:#fff;--surface:#fff;--surface-2:#f2efe9;
  --line:rgba(140,110,40,.22);--line-soft:rgba(0,0,0,.08);
  --gold:#a4832f;--gold-2:#8f7434;--white:#141416;--muted:#6b6b73;--muted-2:#9a9aa2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:var(--ff-body);font-weight:300;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .6s var(--ease),color .6s var(--ease)}
body.locked{overflow:hidden;height:100vh}
img{display:block;max-width:100%;height:auto}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold);color:#08080a}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--black)}
::-webkit-scrollbar-thumb{background:var(--gold-3);border-radius:8px}
.display{font-family:var(--ff-display);font-weight:300;line-height:.98;letter-spacing:-.02em}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
.eyebrow.dim{color:var(--muted-2)}
.gold-text{background:linear-gradient(100deg,#8f7434 0%,#e3cf9a 38%,#c9a961 60%,#8f7434 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#intro{position:fixed;inset:0;z-index:9999;background:#050506;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.1s var(--ease),visibility 1.1s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#intro::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(201,169,97,.10),transparent 70%);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.intro-inner{position:relative;text-align:center;padding:0 24px}
.intro-mark{font-family:var(--ff-display);font-weight:300;color:#f4f2ed;font-size:clamp(30px,7.2vw,74px);letter-spacing:.24em;opacity:0;transform:translateY(22px);filter:blur(10px);animation:introMark 2.1s var(--ease) .35s forwards}
.intro-mark span{display:block;font-size:.42em;letter-spacing:.6em;color:#c9a961;margin-top:.55em;font-weight:400}
@keyframes introMark{0%{opacity:0;transform:translateY(22px);filter:blur(10px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
.intro-line{width:0;height:1px;background:linear-gradient(90deg,transparent,#c9a961,transparent);margin:34px auto 26px;animation:introLine 1.6s var(--ease) 1.1s forwards}
@keyframes introLine{to{width:min(340px,70vw)}}
.intro-tag{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:#8e8e97;opacity:0;animation:introFade 1.4s var(--ease) 1.5s forwards;padding-left:.5em}
@keyframes introFade{to{opacity:1}}
.intro-bar{position:absolute;bottom:0;left:0;height:1px;width:0;background:linear-gradient(90deg,#8f7434,#e3cf9a);animation:introBar 4.6s var(--ease-2) .2s forwards}
@keyframes introBar{to{width:100%}}
.intro-skip{position:absolute;bottom:38px;right:38px;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#63636c;opacity:0;animation:introFade 1s ease 2.4s forwards;transition:color .3s}
.intro-skip:hover{color:#c9a961}
#nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:800;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);transition:background .5s var(--ease),backdrop-filter .5s,border-color .5s,height .5s var(--ease);border-bottom:1px solid transparent}
#nav.solid{background:rgba(8,8,10,.72);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-bottom-color:var(--line-soft);height:64px}
html[data-theme="light"] #nav.solid{background:rgba(247,245,241,.78)}
.brand{font-family:var(--ff-display);font-size:clamp(15px,1.6vw,19px);letter-spacing:.3em;font-weight:400;white-space:nowrap;cursor:pointer;user-select:none;display:flex;align-items:center;gap:12px}
.brand small{display:block;font-family:var(--ff-body);font-size:7.5px;letter-spacing:.52em;color:var(--gold);margin-top:4px;font-weight:500}
.brand img{height:42px;width:auto;max-width:180px;object-fit:contain;display:block}
.brand .b-txt{display:block}
.nav-links{display:flex;align-items:center;gap:clamp(16px,2.4vw,38px)}
.nav-links a{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:400;color:var(--muted);position:relative;padding:6px 0;transition:color .4s var(--ease)}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .55s var(--ease)}
.nav-links a:hover,.nav-links a.active{color:var(--white)}
.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);transform-origin:left}
.nav-actions{display:flex;align-items:center;gap:18px}
.btn-ghost{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);padding:10px 20px;border-radius:100px;transition:all .5s var(--ease);white-space:nowrap}
.btn-ghost:hover{background:var(--gold);color:#08080a;border-color:var(--gold)}
.burger{display:none;width:34px;height:34px;position:relative}
.burger i{position:absolute;left:6px;right:6px;height:1px;background:var(--white);transition:.45s var(--ease)}
.burger i:nth-child(1){top:13px}.burger i:nth-child(2){top:20px}
.burger.on i:nth-child(1){top:17px;transform:rotate(45deg);background:var(--gold)}
.burger.on i:nth-child(2){top:17px;transform:rotate(-45deg);background:var(--gold)}
#mobileMenu{position:fixed;inset:0;z-index:790;background:var(--black);display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);clip-path:inset(0 0 100% 0);transition:clip-path .85s var(--ease)}
#mobileMenu.open{clip-path:inset(0 0 0 0)}
#mobileMenu a{font-family:var(--ff-display);font-size:clamp(28px,8vw,48px);font-weight:300;padding:12px 0;border-bottom:1px solid var(--line-soft);opacity:0;transform:translateY(24px);transition:.7s var(--ease);display:flex;justify-content:space-between;align-items:baseline}
#mobileMenu.open a{opacity:1;transform:none}
#mobileMenu a span{font-family:var(--ff-body);font-size:9px;letter-spacing:.3em;color:var(--gold)}
#mobileMenu.open a:nth-child(1){transition-delay:.10s}
#mobileMenu.open a:nth-child(2){transition-delay:.16s}
#mobileMenu.open a:nth-child(3){transition-delay:.22s}
#mobileMenu.open a:nth-child(4){transition-delay:.28s}
#mobileMenu.open a:nth-child(5){transition-delay:.34s}
#mobileMenu.open a:nth-child(6){transition-delay:.40s}
#mobileMenu.open a:nth-child(7){transition-delay:.46s}
@media(max-width:1024px){.nav-links{display:none}.burger{display:block}.nav-actions .btn-ghost{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:17px 40px;border-radius:100px;font-size:10.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;position:relative;overflow:hidden;transition:all .55s var(--ease);white-space:nowrap;cursor:pointer}
.btn-gold{background:linear-gradient(100deg,#a4832f,#e3cf9a 45%,#c9a961);color:#08080a}
.btn-gold::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,#c9a961,#f0e3bb 50%,#a4832f);opacity:0;transition:opacity .55s var(--ease)}
.btn-gold:hover::before{opacity:1}
.btn-gold span{position:relative;z-index:1}
.btn-gold:hover{box-shadow:0 14px 40px -12px rgba(201,169,97,.55);transform:translateY(-2px)}
.btn-line{border:1px solid var(--line);color:var(--white)}
.btn-line:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.btn-full{width:100%}
.btn:disabled{opacity:.32;pointer-events:none}
.btn-sm{padding:12px 24px;font-size:9.5px;letter-spacing:.2em}
.btn-danger{border:1px solid rgba(201,106,92,.4);color:var(--danger)}
.btn-danger:hover{background:rgba(201,106,92,.1);border-color:var(--danger)}
.field{margin-bottom:22px}
.field label{display:block;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:15px 2px;border-bottom:1px solid var(--line-soft);font-size:15px;font-weight:300;transition:border-color .45s var(--ease);background:transparent;border-radius:0}
.field input:focus,.field select:focus,.field textarea:focus{border-bottom-color:var(--gold)}
.field textarea{resize:vertical;min-height:88px;line-height:1.65}
.field select{cursor:pointer}
.field select option{background:var(--surface);color:var(--white)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:600px){.field-row{grid-template-columns:1fr;gap:0}}
.field-hint{font-size:11px;color:var(--muted-2);margin-top:8px;line-height:1.6}
.field-with-action{position:relative;display:flex;align-items:center;gap:10px}
.field-with-action input{flex:1}
.field-toggle{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);padding:9px 14px;border-radius:100px;transition:.4s var(--ease);white-space:nowrap;flex-shrink:0;background:transparent;cursor:pointer}
.field-toggle:hover{background:var(--gold);color:#08080a;border-color:var(--gold)}
.status-box{border:1px solid var(--line);background:rgba(201,169,97,.05);padding:16px 20px;font-size:12.5px;line-height:1.7;margin-bottom:20px;border-radius:2px}
.status-box.ok{border-color:rgba(127,174,138,.4);background:rgba(127,174,138,.06);color:var(--ok)}
.status-box.warn{border-color:rgba(217,164,65,.4);background:rgba(217,164,65,.06);color:#d9a441}
.status-box.err{border-color:rgba(201,106,92,.4);background:rgba(201,106,92,.06);color:var(--danger)}
main{min-height:100vh}
.page{padding:calc(var(--nav-h) + 60px) var(--pad) 120px;max-width:1560px;margin:0 auto;animation:pageIn .9s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:clamp(40px,6vw,84px);max-width:900px}
.page-head h1{font-size:clamp(38px,7.5vw,92px);margin:18px 0 22px}
.page-head p{color:var(--muted);font-size:clamp(14px,1.5vw,17px);max-width:620px;line-height:1.8}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:0 var(--pad) clamp(60px,11vh,130px);overflow:hidden}
.hero-bg{position:absolute;inset:-8% -4%;z-index:0;will-change:transform}
.hero-bg img,.hero-bg video{width:100%;height:100%;object-fit:cover;filter:brightness(.52) saturate(.88) contrast(1.06)}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--black) 2%,rgba(8,8,10,.55) 42%,rgba(8,8,10,.28) 72%,rgba(8,8,10,.68) 100%),radial-gradient(ellipse 80% 60% at 20% 80%,rgba(201,169,97,.10),transparent 65%)}
html[data-theme="light"] .hero-bg img,html[data-theme="light"] .hero-bg video{filter:brightness(.86) saturate(.95)}
.hero-inner{position:relative;z-index:2;max-width:1120px;width:100%}
.hero h1{font-size:clamp(42px,10.5vw,138px);line-height:.92;margin:22px 0 30px;letter-spacing:-.03em}
.hero h1 em{font-style:italic;color:var(--gold-2)}
.hero .lede{font-size:clamp(14px,1.65vw,19px);color:rgba(244,242,237,.72);max-width:560px;line-height:1.82;font-weight:200;margin-bottom:44px}
html[data-theme="light"] .hero .lede{color:rgba(20,20,22,.72)}
.hero-cta{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.hero-meta{position:absolute;right:var(--pad);bottom:clamp(60px,11vh,130px);z-index:2;text-align:right;display:none}
@media(min-width:1100px){.hero-meta{display:block}}
.hero-meta div{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.hero-meta strong{font-family:var(--ff-display);font-size:26px;font-weight:300;color:var(--gold-2)}
.scroll-hint{position:absolute;left:var(--pad);bottom:26px;z-index:2;display:flex;align-items:center;gap:14px;font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted-2)}
.scroll-hint i{display:block;width:52px;height:1px;background:var(--gold);animation:pulseW 2.4s var(--ease) infinite}
@keyframes pulseW{0%,100%{transform:scaleX(.25);opacity:.35;transform-origin:left}50%{transform:scaleX(1);opacity:1;transform-origin:left}}
section{position:relative}
.sec{padding:clamp(70px,11vw,150px) var(--pad);max-width:1560px;margin:0 auto}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:clamp(38px,5.5vw,72px);flex-wrap:wrap}
.sec-head h2{font-size:clamp(30px,5.6vw,70px);margin-top:16px}
.sec-head p{color:var(--muted);max-width:400px;font-size:14.5px;line-height:1.8}
.reveal{opacity:0;transform:translateY(38px);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.reveal.in{opacity:1;transform:none}
.cine{position:relative;height:clamp(440px,74vh,760px);overflow:hidden;background:var(--black-2)}
.cine-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.5s var(--ease);pointer-events:none}
.cine-slide.on{opacity:1;pointer-events:auto}
.cine-slide .media{position:absolute;inset:-6%;will-change:transform}
.cine-slide .media img,.cine-slide .media video{width:100%;height:100%;object-fit:cover;filter:brightness(.48)}
.cine-slide.on .media{animation:kenburns 8s var(--ease) forwards}
@keyframes kenburns{from{transform:scale(1.14) translateX(2%)}to{transform:scale(1.02) translateX(-1%)}}
.cine-slide::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,var(--black) 0%,rgba(8,8,10,.72) 34%,transparent 72%)}
.cine-body{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);max-width:780px}
.cine-body>*{opacity:0;transform:translateY(28px);transition:.95s var(--ease)}
.cine-slide.on .cine-body>*{opacity:1;transform:none}
.cine-slide.on .cine-body>*:nth-child(1){transition-delay:.35s}
.cine-slide.on .cine-body>*:nth-child(2){transition-delay:.48s}
.cine-slide.on .cine-body>*:nth-child(3){transition-delay:.60s}
.cine-slide.on .cine-body>*:nth-child(4){transition-delay:.72s}
.cine-body h3{font-size:clamp(32px,6.6vw,84px);margin:16px 0 20px;line-height:.98}
.cine-body p{color:rgba(244,242,237,.7);max-width:470px;font-size:15px;line-height:1.8;margin-bottom:32px;font-weight:200}
.cine-nav{position:absolute;bottom:34px;right:var(--pad);z-index:5;display:flex;align-items:center;gap:22px}
.cine-dots{display:flex;gap:11px}
.cine-dots i{width:26px;height:1px;background:rgba(255,255,255,.22);cursor:pointer;transition:.5s var(--ease)}
.cine-dots i.on{background:var(--gold);width:52px}
.cine-arrow{width:44px;height:44px;border:1px solid rgba(255,255,255,.16);border-radius:50%;display:grid;place-items:center;transition:.5s var(--ease);font-size:14px;color:#fff;background:transparent}
.cine-arrow:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,169,97,.08)}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:clamp(20px,2.6vw,38px)}
@media(max-width:760px){.svc-grid{grid-template-columns:1fr}}
.svc-card{position:relative;background:var(--surface);border:1px solid var(--line-soft);overflow:hidden;cursor:pointer;transition:transform .8s var(--ease),border-color .6s;display:flex;flex-direction:column}
.svc-card:hover{transform:translateY(-8px);border-color:var(--line)}
.svc-media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--black-2)}
.svc-media img{width:100%;height:100%;object-fit:cover;transition:transform 1.5s var(--ease),filter .7s;filter:brightness(.82) saturate(.94)}
.svc-card:hover .svc-media img{transform:scale(1.07);filter:brightness(.95) saturate(1.02)}
.svc-badge{position:absolute;top:16px;left:16px;z-index:2;background:linear-gradient(100deg,#a4832f,#e3cf9a);color:#08080a;font-size:9px;font-weight:600;letter-spacing:.16em;padding:7px 13px;border-radius:100px}
.svc-dur{position:absolute;bottom:16px;right:16px;z-index:2;background:rgba(8,8,10,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);font-size:9px;letter-spacing:.22em;text-transform:uppercase;padding:8px 14px;border-radius:100px;color:#f4f2ed}
.svc-body{padding:26px 24px 30px;display:flex;flex-direction:column;flex:1}
.svc-body h3{font-size:clamp(22px,2.4vw,29px);margin-bottom:10px;line-height:1.12}
.svc-body p{color:var(--muted);font-size:13.5px;line-height:1.72;flex:1;margin-bottom:20px;font-weight:300}
.price-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line-soft)}
.price-old{font-size:13px;color:var(--muted-2);text-decoration:line-through;text-decoration-color:var(--danger)}
.price-now{font-family:var(--ff-display);font-size:29px;color:var(--gold-2);font-weight:400}
.price-tag{margin-left:auto;font-size:9px;letter-spacing:.18em;color:var(--ok);border:1px solid rgba(127,174,138,.32);padding:5px 10px;border-radius:100px}
.pro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,2.6vw,34px)}
.pro-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line-soft);transition:.7s var(--ease);cursor:pointer}
.pro-card:hover{border-color:var(--line);transform:translateY(-6px)}
.pro-photo{aspect-ratio:3/4;overflow:hidden;position:relative}
.pro-photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(.35) brightness(.86);transition:1.4s var(--ease)}
.pro-card:hover .pro-photo img{filter:grayscale(0) brightness(1);transform:scale(1.05)}
.pro-info{padding:26px 24px 30px}
.pro-info h3{font-size:26px;margin-bottom:7px}
.pro-info .role{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.pro-info p{color:var(--muted);font-size:13.5px;line-height:1.75}
.folio-filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:44px}
.chip{padding:11px 22px;border:1px solid var(--line-soft);border-radius:100px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);transition:.5s var(--ease);background:transparent;cursor:pointer}
.chip:hover{border-color:var(--line);color:var(--white)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#08080a}
.folio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.folio-item{position:relative;overflow:hidden;aspect-ratio:1;background:var(--black-2);cursor:pointer}
.folio-item img{width:100%;height:100%;object-fit:cover;filter:brightness(.78);transition:1.3s var(--ease)}
.folio-item:hover img{transform:scale(1.08);filter:brightness(1)}
.folio-item .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 22px;background:linear-gradient(to top,rgba(8,8,10,.94),transparent);transform:translateY(12px);opacity:0;transition:.6s var(--ease)}
.folio-item:hover .cap{transform:none;opacity:1}
.folio-item .cap b{display:block;font-family:var(--ff-display);font-size:21px;font-weight:400;color:#f4f2ed}
.folio-item .cap span{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}

      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  return {
    async put(key, blob){
      const db = await open();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, key);
        tx.oncomplete = () => resolve(key);
        tx.onerror = () => reject(tx.error);
      });
    },
    async get(key){
      const db = await open();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    },
    async del(key){
      const db = await open();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    },
    async clear(){
      const db = await open();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    },
    async estimate(){
      if(navigator.storage && navigator.storage.estimate){
        try{ return await navigator.storage.estimate(); }catch(e){ return null; }
      }
      return null;
    }
  };
})();

const MEDIA_CACHE = Object.create(null);
const IDB_PREFIX = 'idb:';
function isIdbRef(v){ return typeof v === 'string' && v.indexOf(IDB_PREFIX)===0; }
function idbKey(v){ return v.slice(IDB_PREFIX.length); }
function mediaSrc(v){
  if(!v) return '';
  if(isIdbRef(v)) return MEDIA_CACHE[idbKey(v)] || '';
  return v;
}

async function resolveAllMedia(){
  const ids = new Set();
  const walk = v => {
    if(v == null) return;
    if(typeof v === 'string'){ if(isIdbRef(v)) ids.add(idbKey(v)); return; }
    if(Array.isArray(v)){ v.forEach(walk); return; }
    if(typeof v === 'object'){ for(const k in v) walk(v[k]); }
  };
  walk(DB);
  const promises = [];
  ids.forEach(id=>{
    promises.push(
      MediaDB.get(id).then(blob=>{ if(blob) MEDIA_CACHE[id] = URL.createObjectURL(blob); })
        .catch(err => console.warn('[mediaResolve]', id, err))
    );
  });
  await Promise.all(promises);
}

async function storeBlob(blob){
  const key = 'm_' + uid() + '_' + Date.now();
  await MediaDB.put(key, blob);
  MEDIA_CACHE[key] = URL.createObjectURL(blob);
  return IDB_PREFIX + key;
}

async function removeMedia(ref){
  if(!isIdbRef(ref)) return;
  const key = idbKey(ref);
  if(MEDIA_CACHE[key]){ try{ URL.revokeObjectURL(MEDIA_CACHE[key]); }catch(e){} delete MEDIA_CACHE[key]; }
  try{ await MediaDB.del(key); }catch(e){ console.warn(e); }
}

/* ============================================================
   EXTERNAL STORE — IndexedDB como substituto do localStorage
   ============================================================ */
const ExternalStore = (function(){
  const IDB_NAME = 'stc_external_store_v1';
  const STORE = 'kv';
  let dbPromise = null;
  const memCache = Object.create(null);
  let ready = false;

  function open(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      if(!('indexedDB' in window)){ reject(new Error('IndexedDB indisponível')); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function loadAll(){
    const db = await open();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readonly');
      const store = tx.objectStore(STORE);
      const keysReq = store.getAllKeys();
      const valsReq = store.getAll();
      tx.oncomplete = () => {
        const keys = keysReq.result || [];
        const vals = valsReq.result || [];
        for(let i=0;i<keys.length;i++){ memCache[String(keys[i])] = vals[i]; }
        ready = true;
        resolve(keys.length);
      };
      tx.onerror = () => reject(tx.error);
    });
  }

  function set(key, value){
    memCache[key] = value;
    return open().then(db => new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  }

  function remove(key){
    delete memCache[key];
    return open().then(db => new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  }

  async function clear(){
    for(const k in memCache) delete memCache[k];
    const db = await open();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function estimate(){
    if(navigator.storage && navigator.storage.estimate){
      try{ return await navigator.storage.estimate(); }catch(e){ return null; }
    }
    return null;
  }

  return {
    loadAll, set, remove, clear, estimate,
    isReady(){ return ready; },
    hasSync(key){ return key in memCache; },
    getSync(key){ return memCache[key]; },
    keysSync(){ return Object.keys(memCache); },
    sizeKB(){
      let total = 0;
      for(const k in memCache){
        const v = memCache[k];
        if(typeof v === 'string') total += v.length;
      }
      return total / 1024;
    }
  };
})();

async function migrateLocalStorageToExternal(){
  if(!ExternalStore.isReady()) return 0;
  const keys = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k) keys.push(k);
    }
  }catch(e){ return 0; }

  let migrated = 0;
  for(const key of keys){
    if(ExternalStore.hasSync(key)) continue;
    const val = localStorage.getItem(key);
    if(val == null) continue;
    try{
      await ExternalStore.set(key, val);
      migrated++;
    }catch(e){ console.warn('[migrate]', key, e); }
  }

  try{
    for(const key of keys){
      if(ExternalStore.hasSync(key)){ localStorage.removeItem(key); }
    }
  }catch(e){}

  if(migrated > 0){ console.log('[migrate]', migrated, 'chave(s) movidas para IndexedDB'); }
  return migrated;
}

let _lsPatched = false;
function patchLocalStorage(){
  if(_lsPatched) return;
  _lsPatched = true;

  const ls = window.localStorage;
  const origSetItem    = ls.setItem.bind(ls);
  const origGetItem    = ls.getItem.bind(ls);
  const origRemoveItem = ls.removeItem.bind(ls);

  ls.setItem = function(key, value){
    const strVal = String(value);
    if(ExternalStore.isReady()){
      ExternalStore.set(String(key), strVal).catch(e => console.warn('[ExternalStore.set]', e));
      if(strVal.length < 4096){
        try{ origSetItem(key, strVal); }catch(e){}
      }
      return;
    }
    try{ origSetItem(key, strVal); }
    catch(e){
      if(ExternalStore.isReady()){ ExternalStore.set(String(key), strVal).catch(()=>{}); }
      else { throw e; }
    }
  };

  ls.getItem = function(key){
    if(ExternalStore.isReady() && ExternalStore.hasSync(key)){
      const v = ExternalStore.getSync(key);
      if(typeof v === 'string') return v;
    }
    return origGetItem(key);
  };

  ls.removeItem = function(key){
    if(ExternalStore.isReady()){ ExternalStore.remove(String(key)).catch(()=>{}); }
    try{ origRemoveItem(key); }catch(e){}
  };
}

/* ============================================================
   COMPRESSÃO + MIGRAÇÃO DATA-URL → BLOB
   ============================================================ */
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1600;
  quality = quality || 0.78;
  return new Promise((resolve)=>{
    if(file.type === 'image/gif' || file.type === 'image/svg+xml'){ resolve(file); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = ()=>{
        let {width:w, height:h} = img;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        const outW = Math.round(w * scale);
        const outH = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, outW, outH);
        ctx.drawImage(img, 0, 0, outW, outH);
        canvas.toBlob(blob => {
          if(!blob){ resolve(file); return; }
          if(blob.size >= file.size && scale === 1){ resolve(file); return; }
          resolve(blob);
        }, 'image/jpeg', quality);
      };
      img.onerror = ()=> resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = ()=> resolve(file);
    reader.readAsDataURL(file);
  });
}

function dataURLtoBlob(dataURL){
  try{
    const parts = String(dataURL).split(',');
    if(parts.length < 2) return null;
    const header = parts[0];
    const m = header.match(/:(.*?);/);
    const mime = m ? m[1] : 'image/jpeg';
    const bstr = atob(parts[1]);
    const n = bstr.length;
    const u8 = new Uint8Array(n);
    for(let i=0;i<n;i++) u8[i] = bstr.charCodeAt(i);
    return new Blob([u8], {type: mime});
  }catch(e){ console.warn('[dataURLtoBlob]', e); return null; }
}

async function migrateLegacyDataURLs(){
  let migrated = 0;
  async function migrateHolder(holder, key){
    if(!holder) return;
    const val = holder[key];
    if(typeof val !== 'string') return;
    if(val.indexOf('data:') !== 0) return;
    if(val.length < 500) return;
    const blob = dataURLtoBlob(val);
    if(!blob) return;
    try{
      const ref = await storeBlob(blob);
      holder[key] = ref;
      migrated++;
    }catch(e){ console.warn('[migrate]', key, e); }
  }
  async function migrateArray(arr){
    if(!Array.isArray(arr)) return;
    for(let i=0;i<arr.length;i++){
      const val = arr[i];
      if(typeof val !== 'string') continue;
      if(val.indexOf('data:') !== 0) continue;
      if(val.length < 500) continue;
      const blob = dataURLtoBlob(val);
      if(!blob) continue;
      try{
        const ref = await storeBlob(blob);
        arr[i] = ref;
        migrated++;
      }catch(e){ console.warn('[migrate-arr]', e); }
    }
  }
  await migrateHolder(DB.settings, 'logo');
  await migrateHolder(DB.settings, 'favicon');
  await migrateHolder(DB.settings, 'heroMedia');
  for(const s of (DB.services||[])){ await migrateHolder(s, 'img'); await migrateArray(s.gallery); }
  for(const p of (DB.professionals||[])){ await migrateHolder(p, 'img'); await migrateArray(p.gallery); }
  for(const item of (DB.portfolio||[])){ await migrateHolder(item, 'img'); }
  for(const b of (DB.beforeAfter||[])){ await migrateHolder(b, 'before'); await migrateHolder(b, 'after'); }
  for(const m of (DB.media||[])){ await migrateHolder(m, 'src'); }
  if(migrated > 0){
    console.log('[migrateLegacyDataURLs] Migrados', migrated, 'itens');
    saveDB();
    toast('📦 '+migrated+' imagem(ns) antiga(s) movida(s)');
  }
  return migrated;
}

function pickMedia(accept, cb){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept;
  inp.onchange = () => {
    const files = Array.prototype.slice.call(inp.files||[]);
    files.forEach(f => cb(f));
  };
  inp.click();
}
function pickImage(cb){ pickMedia('image/*', cb); }

async function saveFileMedia(file){
  if(file.type.indexOf('image/') === 0){
    const blob = await compressImage(file);
    return await storeBlob(blob);
  }
  if(file.type.indexOf('video/') === 0){
    if(file.size > 80 * 1024 * 1024){ throw new Error('Vídeo muito grande. Use até 80MB ou URL externa.'); }
    return await storeBlob(file);
  }
  return await storeBlob(file);
}

const MP_KEY = 'stc_mp_config_v1';
function loadMpConfig(){
  try{
    const raw = localStorage.getItem(MP_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    return (obj && typeof obj === 'object') ? obj : null;
  }catch(e){ return null; }
}
function saveMpConfig(){
  try{
    const S = DB.settings;
    const payload = {
      mpPublicKey:   String(S.mpPublicKey   || ''),
      mpAccessToken: String(S.mpAccessToken || ''),
      mpConnected:   !!S.mpConnected,
      updatedAt:     Date.now()
    };
    localStorage.setItem(MP_KEY, JSON.stringify(payload));
    const raw2 = localStorage.getItem(MP_KEY);
    if(!raw2) return { ok:false, error:'write_void' };
    const back = JSON.parse(raw2);
    if(back.mpPublicKey === payload.mpPublicKey && back.mpAccessToken === payload.mpAccessToken){
      return { ok:true, payload };
    }
    return { ok:false, error:'verify_mismatch' };
  }catch(e){
    console.error('[saveMpConfig]', e);
    let err = 'unknown';
    if(e){
      if(e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014) err = 'quota';
      else if(e.name === 'SecurityError') err = 'security';
      else err = e.message || 'unknown';
    }
    return { ok:false, error: err };
  }
}

};

function saveDB(){
  if(!Storage.available()) return { ok:false, error:'unavailable' };
  const res = Storage.set(KEYS.DB, DB);
  if(res === true){
    try{
      const raw = localStorage.getItem(KEYS.DB);
      if(!raw || raw.length < 20){
        toast('❌ Falha ao verificar gravação');
        return { ok:false, error:'verify' };
      }
    }catch(e){ return { ok:false, error:'verify_error' }; }
    return { ok:true };
  }
  if(res && res.error === 'quota'){
    toast('❌ Armazenamento cheio — não foi possível salvar');
    return { ok:false, error:'quota' };
  }
  toast('❌ Falha ao salvar. Tente novamente.');
  return { ok:false, error:'failed' };
}

function saveAdminCreds(){

function availableSlots(proId, dateISO, duration){
  const p = pro(proId); if(!p) return [];
  const d = new Date(dateISO+'T12:00:00');
  const wd = d.getDay();
  const biz = DB.hours[wd];
  if(!biz) return [];
  if(!p.days || p.days.indexOf(wd)<0) return [];
  if(DB.blocked.some(b => b.date===dateISO && (!b.proId || b.proId===proId))) return [];
  const open = biz[0], close = biz[1];
  const step = 30;
  const slots = [];
  const busy = DB.appointments
    .filter(a => a.proId===proId && a.date===dateISO && a.status!=='canceled')
    .map(a => {
      const s = svc(a.serviceId);
      const dur = s ? s.dur : 60;
      const parts = a.time.split(':').map(Number);
      const start = parts[0]*60 + parts[1];
      return {start, end: start+dur};
    })
    .concat(DB.blocked.filter(b=>b.date===dateISO && b.proId===proId).map(b=>{
      const parts = (b.time||'00:00').split(':').map(Number);
      const start = parts[0]*60 + parts[1];
      return {start, end: start+(b.dur||60)};
    }));
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const isToday = dateISO === today();
  for(let t = open*60; t + duration <= close*60; t += step){
    const conflict = busy.some(b => t < b.end && (t+duration) > b.start);
    const past = isToday && (t <= nowMin + 60);
    if(!conflict && !past){
      const hh = String(Math.floor(t/60)).padStart(2,'0');
      const mm = String(t%60).padStart(2,'0');
      slots.push(hh+':'+mm);
    }
  }
  return slots;
}

function nextDates(count){
  const out = [];
  const d = new Date();
  for(let i=0;i<count;i++){
    const iso = d.toISOString().slice(0,10);
    if(DB.hours[d.getDay()]) out.push(iso);
    d.setDate(d.getDate()+1);
  }
  return out;
}

function applyCoupon(code, subtotal){
  const c = DB.coupons.find(x=>x.code.toUpperCase()===String(code||'').toUpperCase().trim() && x.active);
  if(!c) return {ok:false,msg:'Cupom inválido'};
  if(c.expires && c.expires < today()) return {ok:false,msg:'Cupom expirado'};
  if(c.limit && (c.used||0) >= c.limit) return {ok:false,msg:'Cupom esgotado'};
  if(subtotal < (c.min||0)) return {ok:false,msg:'Valor mínimo '+money(c.min)};
  const off = c.type==='percent' ? subtotal*(c.value/100) : c.value;
  return {ok:true, coupon:c, off:Math.min(off, subtotal)};
}

function depositFor(total){
  const s = DB.settings;
  if(!s.depositEnabled) return 0;
  return s.depositType==='percent' ? total*(s.depositValue/100) : Math.min(s.depositValue, total);
}

let io;
function initReveals(){
  if(io) io.disconnect();
  if(!('IntersectionObserver' in window)){ $$('.reveal').forEach(el=>el.classList.add('in')); return; }
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:.12, rootMargin:'0px 0px -8% 0px'});
  $$('.reveal').forEach(el=>io.observe(el));
}

let cineTimer;
function initCine(){
  const root = $('.cine'); if(!root) return;
  const slides = $$('.cine-slide',root), dots = $$('.cine-dots i',root);
  if(!slides.length) return;
  let i = 0;
  const show = n => {
    i = (n+slides.length)%slides.length;
    slides.forEach((s,k)=>s.classList.toggle('on',k===i));
    dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  };
  show(0);
  if(cineTimer) clearInterval(cineTimer);
  cineTimer = setInterval(()=>show(i+1), 6500);
  dots.forEach((d,k)=>d.addEventListener('click',()=>{ show(k); if(cineTimer) clearInterval(cineTimer); cineTimer=setInterval(()=>show(i+1),6500); }));
  root.querySelectorAll('[data-cine]').forEach(b=>b.addEventListener('click',()=>{
    show(i + (b.dataset.cine==='next'?1:-1));
    if(cineTimer) clearInterval(cineTimer); cineTimer=setInterval(()=>show(i+1),6500);
  }));
}

function initBA(){
  $$('.ba-wrap').forEach(w=>{
    if(w.dataset.init) return; w.dataset.init = '1';
    const after = $('.ba-after',w), handle = $('.ba-handle',w);
    if(!after || !handle) return;
    let dragging = false;
    const move = x => {
      const r = w.getBoundingClientRect();
      let p = ((x - r.left)/r.width)*100;
      p = Math.max(2,Math.min(98,p));
      after.style.clipPath = 'inset(0 0 0 '+p+'%)';
      handle.style.left = p+'%';
    };
    const start = e => { dragging = true; move(e.touches?e.touches[0].clientX:e.clientX); };
    const mv = e => { if(dragging) move(e.touches?e.touches[0].clientX:e.clientX); };
    const end = ()=> dragging = false;
    w.addEventListener('mousedown',start); w.addEventListener('mousemove',mv);
    window.addEventListener('mouseup',end);
    w.addEventListener('touchstart',start,{passive:true});
    w.addEventListener('touchmove',mv,{passive:true});
    w.addEventListener('touchend',end);
  });
}

const STEPS = ['Serviço','Profissional','Data','Horário','Confirmação','Pagamento'];
const BK = { step:0, serviceId:null, proId:null, date:null, time:null, coupon:null, off:0, pay:null };
function resetBooking(){ BK.step=0; BK.serviceId=null; BK.proId=null; BK.date=null; BK.time=null; BK.coupon=null; BK.off=0; BK.pay=null; }

function viewBooking(){
  const qs = (location.hash.split('?')[1]||'');
  const params = new URLSearchParams(qs);
  const pre = params.get('s');
  if(pre && svc(pre) && BK.step===0 && !BK.serviceId){ BK.serviceId = pre; }
  return '<div class="page">'
    + '<div class="page-head" style="margin-bottom:34px">'
    + '<div class="eyebrow">Agendamento</div>'
    + '<h1 class="display" style="font-size:clamp(32px,6vw,72px)">Reserve seu<br>momento</h1></div>'
    + '<div class="flow">'
    + '<div class="steps" id="bkSteps">'
    + STEPS.map((s,i)=>'<div class="step" data-step="'+i+'"><b>'+String(i+1).padStart(2,'0')+'</b><span>'+s+'</span></div>').join('')
    + '</div>'
    + '<div id="bkBody"></div>'
    + '</div></div>' + footer();
}

function renderBookingFlow(){
  const box = $('#bkBody'); if(!box) return;
  const stepsEl = $('#bkSteps');
  if(stepsEl){
    $$('.step',stepsEl).forEach((el,i)=>{
      el.classList.toggle('on', i===BK.step);
      el.classList.toggle('done', i<BK.step);
    });
  }
  const S = DB.settings;

  if(BK.step===0){
    box.innerHTML = '<div class="eyebrow dim" style="margin-bottom:26px">Escolha o serviço</div>'
      + '<div class="pick-grid">'
      + DB.services.filter(s=>s.active).map(s=>''
        + '<button class="pick '+(BK.serviceId===s.id?'on':'')+'" data-pick="serviceId" data-val="'+s.id+'">'
        + '<b>'+esc(s.name)+'</b>'
        + '<small>'+durLabel(s.dur)+' · '+esc(s.cat)+'</small>'
        + '<div class="p">'+(s.promo?'<span class="price-old" style="font-size:11px">'+money(s.price)+'</span> ':'')+money(finalPrice(s))+'</div>'
        + '</button>').join('')
      + '</div>'
      + '<div class="flow-nav"><span></span>'
      + '<button class="btn btn-gold" data-next="1" '+(!BK.serviceId?'disabled':'')+'><span>Continuar</span></button>'
      + '</div>';
    return;
  }

  if(BK.step===1){
    const eligible = DB.professionals.filter(p=>p.active && (!BK.serviceId || p.services.indexOf(BK.serviceId)>=0));
    if(eligible.length===1 && !BK.proId) BK.proId = eligible[0].id;
    box.innerHTML = '<div class="eyebrow dim" style="margin-bottom:26px">Escolha o profissional</div>'
      + (eligible.length===1 ? ''
        + '<div class="card" style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">'
        + '<img src="'+mediaSrc(eligible[0].img)+'" style="width:96px;height:96px;object-fit:cover;border-radius:50%" alt="">'
        + '<div><div class="eyebrow">Embaixador</div>'
        + '<h3 class="display" style="font-size:34px;margin:10px 0 6px">'+esc(eligible[0].name)+'</h3>'
        + '<p style="color:var(--muted);font-size:13.5px">'+esc(eligible[0].role)+'</p></div></div>'
        : '<div class="pick-grid">'
        + eligible.map(p=>'<button class="pick '+(BK.proId===p.id?'on':'')+'" data-pick="proId" data-val="'+p.id+'"><b>'+esc(p.name)+'</b><small>'+esc(p.role)+'</small></button>').join('')
        + '</div>')
      + '<div class="flow-nav">'
      + '<button class="btn btn-line" data-prev="1"><span>Voltar</span></button>'
      + '<button class="btn btn-gold" data-next="1" '+(!BK.proId?'disabled':'')+'><span>Continuar</span></button>'
      + '</div>';
    return;
  }

  if(BK.step===2){
    const dates = nextDates(24);
    const s = svc(BK.serviceId);
    box.innerHTML = '<div class="eyebrow dim" style="margin-bottom:26px">Escolha a data</div>'
      + '<div class="date-strip">'
      + dates.map(d=>{
        const dt = new Date(d+'T12:00:00');
        const hasSlot = availableSlots(BK.proId, d, s.dur).length>0;
        return '<button class="date '+(BK.date===d?'on':'')+'" data-date="'+d+'" '+(!hasSlot?'disabled style="opacity:.3"':'')+'>'
          + '<small>'+weekdayShort[dt.getDay()]+'</small>'
          + '<b>'+String(dt.getDate()).padStart(2,'0')+'</b>'
          + '<i>'+monthShort[dt.getMonth()]+'</i>'
          + '</button>';
      }).join('')
      + '</div>'
      + '<div class="flow-nav">'
      + '<button class="btn btn-line" data-prev="1"><span>Voltar</span></button>'
      + '<button class="btn btn-gold" data-next="1" '+(!BK.date?'disabled':'')+'><span>Continuar</span></button>'
      + '</div>';
    return;
  }

  if(BK.step===3){
    const s = svc(BK.serviceId);
    const slots = availableSlots(BK.proId, BK.date, s.dur);
    box.innerHTML = '<div class="eyebrow dim" style="margin-bottom:10px">Escolha o horário</div>'
      + '<p style="color:var(--muted);font-size:13px;margin-bottom:28px">Duração do serviço: '+durLabel(s.dur)+' — apenas janelas contínuas disponíveis.</p>'

          ? '<div class="slot-grid">'+slots.map(t=>'<button class="slot '+(BK.time===t?'on':'')+'" data-time="'+t+'">'+t+'</button>').join('')+'</div>'
          : '<div class="empty">Nenhum horário disponível nesta data</div>')
      + '<div class="flow-nav">'
      + '<button class="btn btn-line" data-prev="1"><span>Voltar</span></button>'
      + '<button class="btn btn-gold" data-next="1" '+(!BK.time?'disabled':'')+'><span>Continuar</span></button>'
      + '</div>';
    return;
  }

  if(BK.step===4){
    const s = svc(BK.serviceId), p = pro(BK.proId);
    const base = finalPrice(s);
    const dep = depositFor(base - BK.off);
    box.innerHTML = '<div class="eyebrow dim" style="margin-bottom:26px">Confirme seu agendamento</div>'
      + '<div class="grid-2" style="gap:26px;align-items:start">'

      + '<div class="row"><span>Serviço</span><b>'+esc(s.name)+'</b></div>'
      + '<div class="row"><span>Profissional</span><b>'+esc(p.name)+'</b></div>'
      + '<div class="row"><span>Data</span><b>'+weekday[new Date(BK.date+'T12:00:00').getDay()]+', '+fmtDate(BK.date)+'</b></div>'
      + '<div class="row"><span>Horário</span><b>'+BK.time+' · '+durLabel(s.dur)+'</b></div>'
      + '<div class="row total"><span>Valor</span><b>'+money(base)+'</b></div>'
      + '</div>'
      + '<div>'
      + '<div class="card"><div class="eyebrow dim" style="margin-bottom:18px">Cupom de desconto</div>'
      + '<div style="display:flex;gap:12px;align-items:flex-end">'
      + '<input id="cpInput" placeholder="CÓDIGO" style="flex:1;padding:14px 2px;border-bottom:1px solid var(--line-soft);text-transform:uppercase;letter-spacing:.16em;font-size:13px">'

function bkCoupon(){
  const code = $('#cpInput') ? $('#cpInput').value : '';
  const s = svc(BK.serviceId);
  const r = applyCoupon(code, finalPrice(s));
  const msg = $('#cpMsg');
  if(r.ok){ BK.coupon = r.coupon.code; BK.off = r.off; if(msg){ msg.style.color='var(--ok)'; msg.textContent='Cupom aplicado — '+(r.coupon.label||r.coupon.code); } }
  else { BK.coupon = null; BK.off = 0; if(msg){ msg.style.color='var(--danger)'; msg.textContent = r.msg; } }
  const base = finalPrice(s);
  if($('#bkSub')) $('#bkSub').textContent = money(base);
  if($('#bkOff')) $('#bkOff').textContent = '− '+money(BK.off);
  if($('#bkTotal')) $('#bkTotal').textContent = money(base - BK.off);
}

function bkHold(){
  const s = svc(BK.serviceId);
  const base = finalPrice(s) - BK.off;
  const dep = depositFor(base);
  const user = (function(){ try{ return JSON.parse(localStorage.getItem('stc_user')||'null'); }catch(e){ return null; } })();
  const appt = {
    id: uid(), serviceId:BK.serviceId, proId:BK.proId, date:BK.date, time:BK.time,
    total: base, deposit: dep, balance: base - dep, coupon: BK.coupon,
    status: dep>0 ? 'pending' : 'confirmed', createdAt: Date.now(),
    customer: user
  };
  if(dep>0){ createHold(appt); BK.step = 5; renderBookingFlow(); }
  else { finalizeAppointment(appt); }
}

function startHoldTimer(){
  const el = $('#holdTimer'); if(!el) return;
  if(window._holdInt) clearInterval(window._holdInt);
  window._holdInt = setInterval(()=>{
    const h = getHold();
    if(!h){ clearInterval(window._holdInt); return; }
    const left = Math.max(0, h.expires - Date.now());
    const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
    el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    if(left<=0){
      clearInterval(window._holdInt); clearHold();
      el.textContent = '00:00';
      toast('Reserva expirada. Escolha um novo horário.');
      BK.step = 3; BK.time = null; renderBookingFlow();
    }
  },1000);
}

function simulatePix(){
  const st = $('#pixStatus');
  if(st){ st.className='status-pill pending'; st.textContent='Verificando pagamento...'; }
  setTimeout(()=>{
    if(st){ st.className='status-pill paid'; st.textContent='Pagamento confirmado'; }
    setTimeout(()=>{
      const h = getHold(); if(!h) return;
      h.status='confirmed'; h.paidAt=Date.now(); h.method='pix';
      finalizeAppointment(h);
    }, 1000);
  }, 1400);
}
function payCard(){
  const num = $('#ccNum') ? $('#ccNum').value.replace(/\s/g,'') : '';
  if(!num || num.length<13){ toast('Informe um número de cartão válido'); return; }
  const h = getHold(); if(!h) return;
  h.status='confirmed'; h.paidAt=Date.now(); h.method='card';
  finalizeAppointment(h);
}

function finalizeAppointment(appt){
  clearHold(); if(window._holdInt) clearInterval(window._holdInt);
  DB.appointments.push(appt);
  if(appt.coupon){
    const c = DB.coupons.find(x=>x.code===appt.coupon);
    if(c) c.used = (c.used||0)+1;
  }
  DB.notifications.push({
    id:uid(), type:'appointment', title:'Agendamento confirmado',
    text:(svc(appt.serviceId)||{}).name+' · '+fmtDate(appt.date)+' às '+appt.time,
    date: Date.now(), read:false
  });
  saveDB();
  showConfirmation(appt);
}

function renderAccountBody(){
  const u = (function(){ try{ return JSON.parse(localStorage.getItem('stc_user')||'null'); }catch(e){ return null; } })();

    const btn = $('#auBtn'); if(btn) btn.addEventListener('click', doLogin);

  const lb = $('#logoutBtn'); if(lb) lb.addEventListener('click', doLogout);
  const tabs = $('#accTabs'); if(tabs) tabs.addEventListener('click', e=>{
    const b = e.target.closest('[data-acc]'); if(!b) return;
    accTab = b.dataset.acc;
    $$('#accTabs button').forEach(x=>x.classList.toggle('on', x===b));
    const mine = DB.appointments.filter(a=>a.customer && a.customer.email===u.email);

    $('#accBody').innerHTML = renderAccBody(u, upcoming, past, mine);
  });

    const c = e.target.closest('[data-cancel]'); if(c) cancelAppt(c.dataset.cancel);

function doLogin(){
  const name = $('#auName').value.trim();
  const email = $('#auEmail').value.trim();
  if(!name || !email){ toast('Informe nome e e-mail'); return; }
  const u = { name, email, phone:$('#auPhone').value, birth:$('#auBirth').value };
  try{ localStorage.setItem('stc_user', JSON.stringify(u)); }catch(e){}
  if(!DB.customers.some(c=>c.email===email)){ DB.customers.push(Object.assign({},u,{createdAt:Date.now()})); saveDB(); }
  route(); toast('Bem-vindo ao Studio T Concept');
}
function doLogout(){ try{ localStorage.removeItem('stc_user'); }catch(e){} route(); }
function cancelAppt(id){
  confirmModal('Cancelar agendamento','Tem certeza que deseja cancelar? Conforme a política, o sinal pode não ser reembolsável.',()=>{
    const a = DB.appointments.find(x=>x.id===id);
    if(a){ a.status='canceled'; saveDB(); }
    closeModal(); route(); toast('Agendamento cancelado');
  });
}

let adminAuth = (function(){
  try{
    const s = sessionStorage.getItem(KEYS.SESSION);
    if(!s) return false;
    const obj = JSON.parse(s);
    return obj && obj.ok === true && (Date.now() - obj.at) < 12*60*60*1000;
  }catch(e){ return false; }
})();

function clearAdminSession(){ try{ sessionStorage.removeItem(KEYS.SESSION); }catch(e){} }

function uploadZone(opts){
  const id = opts.id;
  const src = opts.src || '';
  const type = opts.type || 'image';
  const label = opts.label || 'Enviar arquivo';
  const sub = opts.sub || 'JPG · PNG · WEBP · MP4';
  const hasContent = !!src;
  const previewHTML = hasContent
    ? (type==='video'
        ? '<video src="'+src+'" muted loop playsinline></video>'
        : '<img src="'+src+'" alt="">')
    : '';
  return '<div class="upload-zone '+(hasContent?'has-content':'')+'" data-uzone="'+id+'">'
    + (hasContent
        ? '<div class="uz-preview">' + previewHTML
          + '<div class="uz-actions">'
          + '<button type="button" data-uzone-replace="'+id+'">Substituir</button>'
          + '<button type="button" class="danger" data-uzone-remove="'+id+'">Remover</button>'
          + '</div></div>'
        : '<div class="uz-label">'+esc(label)+'</div><div class="uz-sub">'+esc(sub)+'</div>')
    + '</div>';
}

const UPLOAD_HANDLERS = {
  hero: async (ref, isVideo) => {
    if(isIdbRef(DB.settings.heroMedia)) await removeMedia(DB.settings.heroMedia);
    DB.settings.heroMedia = ref;
    DB.settings.heroType = isVideo ? 'video' : 'image';
    saveDB(); toast('Hero atualizado'); route();
  },
  logo: async (ref) => {
    if(isIdbRef(DB.settings.logo)) await removeMedia(DB.settings.logo);
    DB.settings.logo = ref; saveDB(); applyBranding(); toast('Logo atualizada'); route();
  },
  favicon: async (ref) => {
    if(isIdbRef(DB.settings.favicon)) await removeMedia(DB.settings.favicon);
    DB.settings.favicon = ref; saveDB(); applyBranding(); toast('Favicon atualizado'); route();
  }
};

let MODAL_ZONE_CB = Object.create(null);
function registerModalZone(key, onSet, onRemove){
  MODAL_ZONE_CB[key] = { set: onSet, remove: onRemove || null };
}
function unregisterModalZones(){ MODAL_ZONE_CB = Object.create(null); }
async function handleModalZoneUpload(key, file){
  const cb = MODAL_ZONE_CB[key];
  if(!cb){ toast('Zona inválida'); return; }
  try{
    const ref = await saveFileMedia(file);
    cb.set(ref);
  }catch(err){ console.error(err); toast(err.message || 'Erro ao processar arquivo'); }
}
async function handleModalZoneRemove(key){
  const cb = MODAL_ZONE_CB[key];
  if(cb && cb.remove){ await cb.remove(); }
}

function initAdminEvents(){
  const authBtn = $('#adBtn'); if(authBtn) authBtn.onclick = adminLogin;
  const backBtn = $('#adBack'); if(backBtn) backBtn.onclick = ()=>{ location.hash='#/'; };
  const lo = $('#adLogout'); if(lo) lo.onclick = adminLogout;
  const passField = $('#adPass'); if(passField) passField.onkeydown = e=>{ if(e.key==='Enter') adminLogin(); };
  const userField = $('#adUser'); if(userField) userField.onkeydown = e=>{ if(e.key==='Enter'){ const p=$('#adPass'); if(p) p.focus(); } };

  const tabs = $('#adminTabs');
  if(tabs) tabs.onclick = e=>{
    const b = e.target.closest('[data-admin]'); if(!b) return;
    adminTab = b.dataset.admin;
    $$('#adminTabs button').forEach(x=>x.classList.toggle('on', x===b));
    $('#adminBody').innerHTML = renderAdmin();
    initAdminEvents();
  };

  const body = $('#adminBody');
  if(!body) return;

  const saveBtn = $('#saveCredsBtn'); if(saveBtn) saveBtn.onclick = adminSaveCredentials;
  const verifyBtn = $('#verifyCredsBtn'); if(verifyBtn) verifyBtn.onclick = adminVerifyStorage;

  body.addEventListener('change', e=>{
    const t = e.target;
    if(!t || !t.id) return;
    if(adminTab !== 'config') return;
    if(t.id === 'cfMpPublic' || t.id === 'cfMpToken'){ adminSavePayment(); }
  });

  body.onclick = async e => {
    const toggleVis = e.target.closest('[data-toggle-visibility]');
    if(toggleVis){
      const inp = document.getElementById(toggleVis.dataset.toggleVisibility);
      if(inp){
        if(inp.type==='password'){ inp.type='text'; toggleVis.querySelector('span').textContent='Ocultar'; }
        else { inp.type='password'; toggleVis.querySelector('span').textContent='Mostrar'; }
      }
      return;
    }

    const uzReplace = e.target.closest('[data-uzone-replace]');
    if(uzReplace){
      const key = uzReplace.dataset.uzoneReplace;
      const accept = (key==='hero'||key==='svcImg') ? 'image/*,video/*' : 'image/*';
      pickMedia(accept, async (file) => {
        const isVideo = file.type.indexOf('video')>=0;
        if(UPLOAD_HANDLERS[key]){
          const ref = await saveFileMedia(file);
          UPLOAD_HANDLERS[key](ref, isVideo);
        } else if(MODAL_ZONE_CB[key]){
          await handleModalZoneUpload(key, file);
        }
      });
      return;
    }
    const uzRemove = e.target.closest('[data-uzone-remove]');
    if(uzRemove){
      const key = uzRemove.dataset.uzoneRemove;
      if(UPLOAD_HANDLERS[key] && key==='hero'){
        if(isIdbRef(DB.settings.heroMedia)) await removeMedia(DB.settings.heroMedia);
        DB.settings.heroMedia=''; DB.settings.heroType='image';
        saveDB(); toast('Mídia removida'); route(); return;
      }
      if(UPLOAD_HANDLERS[key] && key==='logo'){
        if(isIdbRef(DB.settings.logo)) await removeMedia(DB.settings.logo);
        DB.settings.logo=''; saveDB(); applyBranding(); toast('Logo removida'); route(); return;
      }
      if(UPLOAD_HANDLERS[key] && key==='favicon'){
        if(isIdbRef(DB.settings.favicon)) await removeMedia(DB.settings.favicon);
        DB.settings.favicon=''; saveDB(); applyBranding(); toast('Favicon removido'); route(); return;
      }
      if(MODAL_ZONE_CB[key]){ await handleModalZoneRemove(key); return; }
      return;
    }

    const slotBtn = e.target.closest('[data-upload-slot]');
    if(slotBtn){
      const key = slotBtn.dataset.uploadSlot;
      const accept = slotBtn.dataset.uploadAccept || 'image/*';
      pickMedia(accept, async (file) => {
        const isVideo = file.type.indexOf('video')>=0;
        if(UPLOAD_HANDLERS[key]){
          const ref = await saveFileMedia(file);
          UPLOAD_HANDLERS[key](ref, isVideo);
        }
      });
      return;
    }

    const urlBtn = e.target.closest('[data-upload-url]');
    if(urlBtn){
      const key = urlBtn.dataset.uploadUrl;
      const url = prompt('Cole a URL da imagem ou vídeo:');
      if(!url) return;
      const isVideo = /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url);
      if(UPLOAD_HANDLERS[key]) UPLOAD_HANDLERS[key](url.trim(), isVideo);
      return;
    }

    if(e.target.closest('[data-admin-newportfolio]')){ adminEditPortfolio(null); return; }
    const pfEdit = e.target.closest('[data-portfolio-edit]');
    if(pfEdit){ adminEditPortfolio(pfEdit.dataset.portfolioEdit); return; }
    const pfRem = e.target.closest('[data-portfolio-remove]');
    if(pfRem){ adminDelPortfolio(pfRem.dataset.portfolioRemove); return; }

    if(e.target.closest('[data-admin-newba]')){ adminEditBA(null); return; }
    const baEdit = e.target.closest('[data-admin-editba]');
    if(baEdit){ adminEditBA(baEdit.dataset.adminEditba); return; }
    const baDel = e.target.closest('[data-admin-delba]');
    if(baDel){ adminDelBA(baDel.dataset.adminDelba); return; }

    const mPlace = e.target.closest('[data-media-placement]');
    if(mPlace){
      const m = DB.media.find(x=>x.id===mPlace.dataset.mediaPlacement);
      if(!m) return;
      const opts = ['carousel','portfolio','gallery'];
      const cur = opts.indexOf(m.placement||'gallery');
      m.placement = opts[(cur+1)%opts.length];
      saveDB(); body.innerHTML = renderAdmin(); initAdminEvents();
      toast('Exibição: '+m.placement);
      return;
    }
    const mRem = e.target.closest('[data-media-remove]');
    if(mRem){ adminDelMedia(mRem.dataset.mediaRemove); return; }

    const t = e.target.closest('[data-admin-new],[data-admin-cancel],[data-admin-block],[data-admin-unblock],[data-admin-newsvc],[data-admin-editsvc],[data-admin-delsvc],[data-admin-newpro],[data-admin-editpro],[data-admin-newcp],[data-admin-editcp],[data-admin-delcp],[data-admin-addmedia],[data-admin-savecontent],[data-admin-saveidentity],[data-admin-savepayment],[data-admin-saveexp],[data-admin-reset]');
    if(!t) return;
    if(t.hasAttribute('data-admin-new')) adminNewAppt();
    if(t.hasAttribute('data-admin-cancel')) adminCancelAppt(t.dataset.adminCancel);
    if(t.hasAttribute('data-admin-block')) adminBlock();
    if(t.hasAttribute('data-admin-unblock')) adminUnblock(t.dataset.adminUnblock);
    if(t.hasAttribute('data-admin-newsvc')) adminEditService(null);
    if(t.hasAttribute('data-admin-editsvc')) adminEditService(t.dataset.adminEditsvc);
    if(t.hasAttribute('data-admin-delsvc')) adminDelService(t.dataset.adminDelsvc);
    if(t.hasAttribute('data-admin-newpro')) adminEditPro(null);
    if(t.hasAttribute('data-admin-editpro')) adminEditPro(t.dataset.adminEditpro);
    if(t.hasAttribute('data-admin-newcp')) adminEditCoupon(null);
    if(t.hasAttribute('data-admin-editcp')) adminEditCoupon(t.dataset.adminEditcp);
    if(t.hasAttribute('data-admin-delcp')) adminDelCoupon(t.dataset.adminDelcp);
    if(t.hasAttribute('data-admin-addmedia')) adminAddMedia();
    if(t.hasAttribute('data-admin-savecontent')) adminSaveContent();
    if(t.hasAttribute('data-admin-saveidentity')) adminSaveIdentity();
    if(t.hasAttribute('data-admin-savepayment')) adminSavePayment();
    if(t.hasAttribute('data-admin-saveexp')) adminSaveExp();
    if(t.hasAttribute('data-admin-reset')) adminReset();
  };

  body.onchange = e=>{
    if(e.target.matches('#fileIn')) adminUpload(e.target);
    if(e.target.matches('#portfolioFileIn')) adminUploadPortfolio(e.target);
  };

  const drop = $('#drop');
  if(drop){
    drop.onclick = ()=>$('#fileIn').click();
    drop.ondragover = e=>{ e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = ()=> drop.classList.remove('over');
    drop.ondrop = async e=>{
      e.preventDefault(); drop.classList.remove('over');
      const dt = e.dataTransfer; if(!dt) return;
      const files = Array.prototype.slice.call(dt.files||[]);
      for(const f of files){
        try{
          const ref = await saveFileMedia(f);
          DB.media.push({id:uid(), src:ref, type:f.type.indexOf('video')>=0?'video':'image', placement:'gallery', active:true, createdAt:Date.now()});
        }catch(err){ console.warn(err); toast(err.message||'Erro em '+f.name); }
      }
      saveDB();
      body.innerHTML = renderAdmin(); initAdminEvents(); toast(files.length+' mídia(s) adicionada(s)');
    };
  }

  const pfDrop = $('#portfolioDrop');
  if(pfDrop){
    pfDrop.onclick = ()=>$('#portfolioFileIn').click();
    pfDrop.ondragover = e=>{ e.preventDefault(); pfDrop.classList.add('over'); };
    pfDrop.ondragleave = ()=> pfDrop.classList.remove('over');
    pfDrop.ondrop = async e=>{
      e.preventDefault(); pfDrop.classList.remove('over');
      const dt = e.dataTransfer; if(!dt) return;
      const files = Array.prototype.slice.call(dt.files||[]).filter(f=>f.type.indexOf('image')===0);
      for(const f of files){
        try{
          const ref = await saveFileMedia(f);
          DB.portfolio.push({id:uid(), img:ref, title:'Portfólio', cat:'Transformações', createdAt:Date.now()});
        }catch(err){ console.warn(err); }
      }
      saveDB();
      body.innerHTML = renderAdmin(); initAdminEvents(); toast(files.length+' imagem(ns) adicionada(s)');
    };
  }

  const themeSel = $('#cfTheme');
  if(themeSel) themeSel.onchange = ()=>{ DB.settings.theme = themeSel.value; saveDB(); applyTheme(); };

  $$('[data-uzone]').forEach(zone=>{
    if(zone.dataset.uzoneInit) return; zone.dataset.uzoneInit = '1';
    const key = zone.dataset.uzone;
    if(MODAL_ZONE_CB[key]) return;
    zone.ondragover = e=>{ e.preventDefault(); zone.classList.add('over'); };
    zone.ondragleave = ()=> zone.classList.remove('over');
    zone.ondrop = async e=>{
      e.preventDefault(); zone.classList.remove('over');
      const dt = e.dataTransfer; if(!dt || !dt.files || !dt.files[0]) return;
      const f = dt.files[0];
      const isVideo = f.type.indexOf('video')>=0;
      try{
        const ref = await saveFileMedia(f);
        if(UPLOAD_HANDLERS[key]) UPLOAD_HANDLERS[key](ref, isVideo);
      }catch(err){ toast(err.message||'Erro ao processar'); }
    };
    zone.onclick = async (e)=>{
      if(e.target.closest('.uz-actions')) return;
      if(zone.classList.contains('has-content')) return;
      const accept = (key==='hero') ? 'image/*,video/*' : 'image/*';
      pickMedia(accept, async (file) => {
        const isVideo = file.type.indexOf('video')>=0;
        try{
          const ref = await saveFileMedia(file);
          if(UPLOAD_HANDLERS[key]) UPLOAD_HANDLERS[key](ref, isVideo);
        }catch(err){ toast(err.message||'Erro ao processar'); }
      });
    };
  });
}

function adminLogin(){
  const uRaw = $('#adUser') ? $('#adUser').value : '';
  const pRaw = $('#adPass') ? $('#adPass').value : '';
  const u = (uRaw||'').trim().toLowerCase();
  const p = pRaw||'';
  const fb = $('#adFeedback');
  if(!u || !p){ if(fb){fb.style.display='block';fb.textContent='Preencha e-mail e senha.';} toast('Preencha e-mail e senha'); return; }
  const stored = Storage.get(KEYS.ADMIN, null);
  let validEmail, validPass;
  if(stored && stored.email && stored.password){
    validEmail = String(stored.email).trim().toLowerCase();
    validPass  = String(stored.password);
  } else {
    validEmail = String(ADMIN_CREDS.email || FACTORY_ADMIN_EMAIL).trim().toLowerCase();

async function adminVerifyStorage(){
  const stored = Storage.get(KEYS.ADMIN, null);
  const has = !!(stored && stored.email);
  const mp = loadMpConfig();
  let estimateTxt = '';
  const est = await MediaDB.estimate();
  if(est && est.usage != null){
    const used = (est.usage/1024/1024).toFixed(2);
    const quota = est.quota ? (est.quota/1024/1024).toFixed(0) : '?';
    estimateTxt = 'IDB usado: '+used+'MB de '+quota+'MB';
  }
  let lsTxt = '';
  try{
    let tot = 0;
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      tot += (localStorage.getItem(k) || '').length;
    }
    lsTxt = 'localStorage total: '+(tot/1024).toFixed(1)+' KB';
  }catch(e){}
  alert([
    'Modo: '+(ExternalStore.isReady()?'IndexedDB externo':'localStorage'),
    'Dados no IndexedDB: '+ExternalStore.sizeKB().toFixed(1)+' KB ('+ExternalStore.keysSync().length+' chaves)',
    lsTxt,
    'Admin KEY: '+KEYS.ADMIN,
    'Credenciais: '+(has?'SIM':'NÃO'),
    has ? 'E-mail: '+stored.email : '',
    '--- Mercado Pago ---',
    'Chave MP: '+MP_KEY,
    mp ? 'Public Key: '+(mp.mpPublicKey ? mp.mpPublicKey.slice(0,24)+'…' : '(vazio)') : 'Sem dados salvos',
    mp ? 'Access Token: '+(mp.mpAccessToken ? '(len='+mp.mpAccessToken.length+')' : '(vazio)') : '',
    estimateTxt
  ].filter(Boolean).join('\n'));
  toast('Verificação concluída');
}

function adminSaveCredentials(){
  try{
    const oldPassEl = document.getElementById('cfAdmPassOld');
    const emailEl   = document.getElementById('cfAdmEmail');
    const nameEl    = document.getElementById('cfAdmName');
    const newPassEl = document.getElementById('cfAdmPassNew');
    const newPass2El= document.getElementById('cfAdmPassNew2');
    if(!oldPassEl || !emailEl || !nameEl || !newPassEl || !newPass2El){ toast('Erro: campos ausentes.'); return; }
    const oldPass  = String(oldPassEl.value||'').trim();
    const newEmail = String(emailEl.value||'').trim().toLowerCase();
    const newName  = String(nameEl.value||'').trim() || 'Administrador';
    const newPass  = String(newPassEl.value||'').trim();
    const newPass2 = String(newPass2El.value||'').trim();

    if(!oldPass){ toast('Digite a senha atual'); oldPassEl.focus(); return; }
    const stored = Storage.get(KEYS.ADMIN, null);
    const currentPass = stored && stored.password ? String(stored.password) : String(ADMIN_CREDS.password||FACTORY_ADMIN_PASS);
    if(oldPass !== currentPass){ toast('Senha atual incorreta'); oldPassEl.value=''; oldPassEl.focus(); return; }
    if(!newEmail || newEmail.indexOf('@')<1 || newEmail.indexOf('.')<0){ toast('E-mail inválido'); emailEl.focus(); return; }
    if(newPass || newPass2){
      if(newPass.length < 6){ toast('Nova senha: mínimo 6 caracteres'); newPassEl.focus(); return; }
      if(newPass !== newPass2){ toast('As senhas não coincidem'); newPass2El.value=''; newPass2El.focus(); return; }
    }
    ADMIN_CREDS.email = newEmail;
    ADMIN_CREDS.name = newName;
    ADMIN_CREDS.firstAccess = false;
    ADMIN_CREDS.updatedAt = Date.now();
    if(newPass) ADMIN_CREDS.password = newPass;

    const ok = saveAdminCreds();
    if(!ok){ return; }
    toast(newPass ? 'E-mail e senha salvos' : 'E-mail salvo');
    setTimeout(()=>{ const b = $('#adminBody'); if(b){ b.innerHTML = renderAdmin(); initAdminEvents(); } }, 80);
  }catch(err){ console.error(err); toast('Erro: '+(err.message||'desconhecido')); }
}

function adminSavePayment(){
  try{
    const S = DB.settings;
    const el = id => document.getElementById(id);

    const dep     = el('cfDep');      if(dep)     S.depositEnabled = dep.value==='1';
    const depType = el('cfDepType');  if(depType) S.depositType    = depType.value;
    const depVal  = el('cfDepVal');   if(depVal)  S.depositValue   = Number(depVal.value) || 0;
    const reserve = el('cfReserve');  if(reserve) S.reserveMinutes = Number(reserve.value) || 15;

    const mpPublic = el('cfMpPublic');
    const mpToken  = el('cfMpToken');
    if(!mpPublic || !mpToken){ toast('❌ Campos de Mercado Pago não encontrados'); return; }
    S.mpPublicKey   = String(mpPublic.value || '').trim();
    S.mpAccessToken = String(mpToken.value  || '').trim();
    S.mpConnected   = !!(S.mpPublicKey && S.mpAccessToken && S.mpPublicKey.length >= 10 && S.mpAccessToken.length >= 20);

    const mpRes = saveMpConfig();
    saveDB();

    if(mpRes.ok){
      const pkShort = S.mpPublicKey ? S.mpPublicKey.slice(0,14)+'…' : '(vazio)';
      const tkTxt = S.mpAccessToken ? '(len='+S.mpAccessToken.length+')' : '(vazio)';
      toast('✅ MP salvo · PK:'+pkShort+' · Token:'+tkTxt);
    } else if(mpRes.error === 'quota'){
      toast('❌ Armazenamento cheio');
    } else if(mpRes.error === 'security'){
      toast('❌ Navegador bloqueou o armazenamento');
    } else {
      toast('❌ Falha ao salvar MP: '+mpRes.error);
    }
    route();
  }catch(err){
    console.error('[adminSavePayment]', err);
    toast('❌ Erro: '+(err && err.message || 'desconhecido'));
  }
}

function bindModalZones(){
  $$('#modalBox [data-uzone]').forEach(zone=>{
    if(zone.dataset.modalBound) return;
    zone.dataset.modalBound = '1';
    const key = zone.dataset.uzone;
    if(!MODAL_ZONE_CB[key]) return;
    const replaceBtn = zone.querySelector('[data-uzone-replace]');
    const removeBtn = zone.querySelector('[data-uzone-remove]');
    if(replaceBtn){
      replaceBtn.onclick = (e)=>{
        e.stopPropagation();
        pickMedia('image/*', async (file)=>{ try{ await handleModalZoneUpload(key, file); }catch(err){ toast(err.message||'Erro'); } });
      };
    }
    if(removeBtn){
      removeBtn.onclick = async (e)=>{ e.stopPropagation(); await handleModalZoneRemove(key); };
    }
    if(!zone.classList.contains('has-content')){
      zone.onclick = ()=>{
        pickMedia('image/*', async (file)=>{ try{ await handleModalZoneUpload(key, file); }catch(err){ toast(err.message||'Erro'); } });
      };
    }
    zone.ondragover = e=>{ e.preventDefault(); zone.classList.add('over'); };
    zone.ondragleave = ()=> zone.classList.remove('over');
    zone.ondrop = async e=>{
      e.preventDefault(); e.stopPropagation();
      zone.classList.remove('over');
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(!f) return;
      try{ await handleModalZoneUpload(key, f); }catch(err){ toast(err.message||'Erro'); }
    };
  });
}

/* ============================================================
   TOAST com fila
   ============================================================ */
let toastQueue = [];
let toastActive = false;
function toast(msg){
  toastQueue.push(msg);
  if(!toastActive) processToastQueue();
}
function processToastQueue(){
  if(toastQueue.length === 0){ toastActive = false; return; }
  toastActive = true;
  const msg = toastQueue.shift();
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  const isError = /❌|⚠️/.test(msg);
  setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(processToastQueue, 320);
  }, isError ? 5200 : 3000);
}

function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Copiado')).catch(()=>toast('Copie manualmente'));
  } else {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Copiado'); }catch(e){ toast('Copie manualmente'); }
    document.body.removeChild(ta);
  }
}

function initGlobalDelegation(){
  document.addEventListener('click', e=>{
    const t = e.target;
    const chip = t.closest('[data-cat]');
    if(chip){ svcFilter = chip.dataset.cat; route(); return; }
    const fchip = t.closest('[data-folio]');
    if(fchip){ folioFilter = fchip.dataset.folio; route(); return; }
    const copyBtn = t.closest('[data-copy]');
    if(copyBtn){ copyText(copyBtn.dataset.copy); return; }
    const pick = t.closest('[data-pick]');
    if(pick){
      const k = pick.dataset.pick, v = pick.dataset.val;
      BK[k] = v;
      if(k==='serviceId'){ BK.proId = null; BK.time = null; }
      renderBookingFlow(); return;
    }
    const dateBtn = t.closest('[data-date]');
    if(dateBtn){ BK.date = dateBtn.dataset.date; BK.time = null; renderBookingFlow(); return; }
    const slotBtn = t.closest('[data-time]');
    if(slotBtn){ BK.time = slotBtn.dataset.time; renderBookingFlow(); return; }
    const payBtn = t.closest('[data-pay]');
    if(payBtn){ BK.pay = payBtn.dataset.pay; renderBookingFlow(); return; }
    const next = t.closest('[data-next]');
    if(next && !next.disabled){ BK.step = Math.min(5, BK.step+1); renderBookingFlow(); try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){} return; }
    const prev = t.closest('[data-prev]');
    if(prev){ if(BK.step>0) BK.step--; else location.hash='#/servicos'; renderBookingFlow(); return; }
    const hold = t.closest('[data-hold]');
    if(hold){ bkHold(); return; }
  });
}

function initSecretAccess(){
  document.addEventListener('keydown', e=>{
    if((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')){
      e.preventDefault();
      if(location.hash.replace(/^#/,'') === ADMIN_ROUTE){ const f = $('#adPass') || $('#adUser'); if(f) f.focus(); }
      else { location.hash = '#' + ADMIN_ROUTE; }
    }
  });
  const brand = $('#brandLogo');
  if(brand){
    let clicks = 0, timer = null;
    brand.addEventListener('click', e=>{
      clicks++;
      clearTimeout(timer);
      if(clicks >= 5){ clicks = 0; e.preventDefault(); location.hash = '#' + ADMIN_ROUTE; return; }
      timer = setTimeout(()=>{ clicks = 0; }, 1500);
    });
  }
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  try{
    await ExternalStore.loadAll();
    await migrateLocalStorageToExternal();
    patchLocalStorage();
  }catch(e){
    console.warn('[boot] ExternalStore falhou — usando localStorage:', e);
  }

  loadAll();

  try{ await migrateLegacyDataURLs(); }
  catch(e){ console.warn('[boot] migração dataURL falhou:', e); }

  try{ await resolveAllMedia(); }
  catch(e){ console.warn('Falha ao resolver mídia:', e); }

  applyTheme();
  applyBranding();
  initNav();
  initIntro();
  initGlobalDelegation();
  initSecretAccess();
  window.addEventListener('hashchange', ()=>route());
  route();
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

  setTimeout(()=>{ applyBranding(); }, 300);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
